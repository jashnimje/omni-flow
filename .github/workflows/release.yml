name: Release

# Push a version tag to publish every build:
#   git tag v1.0.0-build.45 && git push origin v1.0.0-build.45
# The version in the file names is the one in packages/omniflow_app/
# pubspec.yaml, so the tag only has to start with v and be new. Run it by
# hand (Actions, Release, Run workflow) to build everything without
# publishing, with "dev" as the version.
#
# The build number is the commit count of the built commit. It rises with
# every release while the version stays the same, and the app's update
# check compares it. Every build job stamps it into the engine's
# version.dart, and the Flutter builds also pass it as --build-number.
#
# A release has eight downloads plus SHA256SUMS:
#   omniflow-<v>-android.apk          arm64, what almost every phone needs.
#                                     The app's updater looks for this name.
#   omniflow-<v>-ios-unsigned.ipa
#   omniflow-<v>-macos.zip
#   omniflow-<v>-windows-x64.zip
#   omniflow-<v>-linux-x64.tar.gz
#   omniflow-<v>-hub-macos.tar.gz     the omni CLI and hub, arm64/ and x64/.
#                                     Not one universal binary: lipo breaks
#                                     a Dart AOT executable, which then
#                                     cannot find its own snapshot.
#   omniflow-<v>-android-extras.zip   apk/ (arm32, x86_64), play/ (the AAB)
#                                     and tv-helper/.
#   omniflow-<v>-firmware.zip         one folder per board.
#
# Signing:
# - Android: the release key comes from three secrets,
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.
#   A tag build fails without them: an APK signed with another key cannot
#   update an installed one, so it would make people uninstall and lose
#   their home. A manual run without them is signed with a debug key.
# - The TV helper is signed with its debug key, as tv_helper/ sets it.
# - iOS: an unsigned .ipa, installable only by sideloading.
# - macOS, Windows, Linux and the CLI: unsigned, so expect Gatekeeper and
#   SmartScreen prompts.
#
# No web build: the engine needs dart:io sockets (UDP, TCP, mDNS) and
# SQLite through FFI, which a browser does not have.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  # The version and build number every other job uses.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      # The whole history, so the commit count is the real one.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: meta
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' packages/omniflow_app/pubspec.yaml)
          [ -n "$version" ] || { echo "No version in pubspec.yaml"; exit 1; }
          [ "$GITHUB_REF_TYPE" = "tag" ] || version="dev"
          build=$(git rev-list --count HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "OmniFlow $version, build $build"

  # Tests run once, here. The build jobs run beside it, and the release
  # waits for it.
  test:
    # macOS, for the same reason as ci.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Engine
        working-directory: packages/omniflow_engine
        run: |
          dart run tool/embed_drivers.dart --check
          dart test
      - name: App
        working-directory: packages/omniflow_app
        run: flutter test

  firmware:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      # The four board toolchains need more disk than the runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Board cores
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr esp32:esp32 esp8266:esp8266 rp2040:rp2040
          arduino-cli lib install Servo
      - name: Build
        working-directory: packages/omniflow_app
        run: dart run tool/firmware_assets.dart
      # The app bundles these, so the Android job takes them as they are.
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-asset
          path: packages/omniflow_app/assets/firmware
      - name: Package
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          fw=packages/omniflow_app/assets/firmware
          mkdir -p pkg/esp32 pkg/esp8266 pkg/uno pkg/pico_w dist
          cp "$fw/esp32.bin"   pkg/esp32/
          cp "$fw/esp8266.bin" pkg/esp8266/
          cp "$fw/uno.hex"     pkg/uno/
          cp "$fw/pico_w.uf2"  pkg/pico_w/
          (cd pkg && zip -qr "$GITHUB_WORKSPACE/dist/omniflow-$V-firmware.zip" .)
      - uses: actions/upload-artifact@v7
        with: { name: firmware, path: dist }

  # Released only inside android-extras.zip, and bundled into the app.
  tv-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        working-directory: tv_helper
        run: ./gradlew assembleRelease -q
      - uses: actions/upload-artifact@v7
        with:
          name: tv-helper-asset
          path: tv_helper/build/outputs/apk/release/omniflow-tv-helper-release.apk

  android:
    needs: [meta, firmware, tv-helper]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      # Two release builds back to back ran the runner short and it was
      # stopped mid-build, so free disk and keep Gradle to a 4 GB heap.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "The release key secrets are not set, so this tag is not published."
              exit 1
            fi
            echo "No release key: this build is signed with a debug key."
            exit 0
          fi
          app=packages/omniflow_app/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$app/app/release.jks"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > "$app/key.properties"

      - uses: actions/download-artifact@v8
        with:
          name: firmware-asset
          path: packages/omniflow_app/assets/firmware
      - uses: actions/download-artifact@v8
        with:
          name: tv-helper-asset
          path: tv-helper-asset
      - run: cp tv-helper-asset/omniflow-tv-helper-release.apk packages/omniflow_app/assets/tv_helper/omniflow-tv-helper.apk

      - run: flutter pub get
      - name: Stamp the build number
        run: sed -i "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" packages/omniflow_engine/lib/src/version.dart
      - name: Build
        working-directory: packages/omniflow_app
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G/' android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          flutter build apk --release --split-per-abi --build-number "$BUILD"
          flutter build appbundle --release --build-number "$BUILD"

      - name: Package
        run: |
          mkdir -p dist extras/apk extras/play extras/tv-helper
          out=packages/omniflow_app/build/app/outputs
          mv "$out/flutter-apk/app-arm64-v8a-release.apk"   "dist/omniflow-$V-android.apk"
          mv "$out/flutter-apk/app-armeabi-v7a-release.apk" "extras/apk/omniflow-$V-android-arm32.apk"
          mv "$out/flutter-apk/app-x86_64-release.apk"      "extras/apk/omniflow-$V-android-x86_64.apk"
          mv "$out/bundle/release/app-release.aab"          "extras/play/omniflow-$V-android.aab"
          cp tv-helper-asset/omniflow-tv-helper-release.apk "extras/tv-helper/omniflow-$V-androidtv-helper.apk"
          (cd extras && zip -qr "$GITHUB_WORKSPACE/dist/omniflow-$V-android-extras.zip" .)
      - uses: actions/upload-artifact@v7
        with: { name: android, path: dist }

  ios:
    needs: meta
    runs-on: macos-latest
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stamp the build number
        run: sed -i '' "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" packages/omniflow_engine/lib/src/version.dart
      - name: Build
        working-directory: packages/omniflow_app
        run: flutter build ios --release --no-codesign --build-number "$BUILD"
      - name: Package an unsigned ipa
        run: |
          mkdir -p Payload dist
          cp -R packages/omniflow_app/build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/omniflow-$V-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: dist }

  macos:
    needs: meta
    runs-on: macos-latest
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stamp the build number
        run: sed -i '' "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" packages/omniflow_engine/lib/src/version.dart
      - name: Build
        working-directory: packages/omniflow_app
        run: flutter build macos --release --build-number "$BUILD"
      - name: Package
        run: |
          mkdir -p dist
          # ditto keeps the bundle's links and modes, which zip -r breaks.
          ditto -c -k --keepParent \
            packages/omniflow_app/build/macos/Build/Products/Release/OmniFlow.app \
            "dist/omniflow-$V-macos.zip"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: dist }

  windows:
    needs: meta
    # Pinned to the image with Visual Studio 2022 (17), the newest one every
    # Flutter release maps to a CMake generator. windows-latest moves on.
    runs-on: windows-2022
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stamp the build number
        shell: bash
        run: sed -i "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" packages/omniflow_engine/lib/src/version.dart
      - name: Build
        shell: bash
        working-directory: packages/omniflow_app
        run: flutter build windows --release --build-number "$BUILD"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd packages/omniflow_app/build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/omniflow-$V-windows-x64.zip" .
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: dist }

  linux:
    needs: meta
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Desktop build packages
        # libsecret for flutter_secure_storage, GTK for the window.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stamp the build number
        run: sed -i "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" packages/omniflow_engine/lib/src/version.dart
      - name: Build
        working-directory: packages/omniflow_app
        run: flutter build linux --release --build-number "$BUILD"
      - name: Package
        run: |
          mkdir -p dist
          tar -C packages/omniflow_app/build/linux/x64/release/bundle -czf \
            "dist/omniflow-$V-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: dist }

  # The omni CLI, which is also the hub. `dart build cli` because sqlite3
  # has build hooks, which `dart compile exe` does not run. The bundle is
  # bin/omni with SQLite in lib/, and they ship together.
  # On Linux and Windows the CLI keeps its macOS-only secret store for now,
  # so those two are built to keep them compiling but are not released.
  # The two macOS bundles are tarred here, since an artifact loses the
  # executable bit, and the release job puts them in one hub-macos archive.
  cli:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os: macos, arch: arm64 }
          - { runner: macos-15-intel, os: macos, arch: x64 }
          - { runner: ubuntu-latest, os: linux, arch: x64 }
          # Flutter has no Linux arm64 SDK, and the pub workspace needs
          # Flutter, so this one is cross-compiled on x64.
          - { runner: ubuntu-latest, os: linux, arch: arm64 }
          - { runner: windows-2022, os: windows, arch: x64 }
    runs-on: ${{ matrix.runner }}
    env:
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stamp the build number
        shell: bash
        run: |
          f=packages/omniflow_engine/lib/src/version.dart
          sed "s/^const int omniflowBuild = .*;/const int omniflowBuild = $BUILD;/" "$f" > "$f.new"
          mv "$f.new" "$f"
      - name: Build
        shell: bash
        working-directory: packages/omniflow_engine
        run: |
          dart build cli --target-os ${{ matrix.os }} --target-arch ${{ matrix.arch }} -o build/omni
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name="cli-${{ matrix.os }}-${{ matrix.arch }}"
          bundle=packages/omniflow_engine/build/omni/bundle
          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd "$bundle" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$name.zip" .)
          else
            tar -C "$bundle" -czf "dist/$name.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  release:
    # Only for a tag. A manual run stops at the artifacts.
    if: github.ref_type == 'tag'
    needs: [meta, test, firmware, tv-helper, android, ios, macos, windows, linux, cli]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Collect
        run: |
          mkdir -p dist
          for d in artifacts/*; do
            # The *-asset artifacts are inputs to the Android build, and the
            # CLI ones are packaged below.
            case "$d" in *-asset|*/cli-*) continue ;; esac
            mv "$d"/* dist/
          done
          mkdir -p hub/arm64 hub/x64
          tar -C hub/arm64 -xzf artifacts/cli-macos-arm64/cli-macos-arm64.tar.gz
          tar -C hub/x64 -xzf artifacts/cli-macos-x64/cli-macos-x64.tar.gz
          tar -C hub -czf "dist/omniflow-$V-hub-macos.tar.gz" arm64 x64
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      # The app's update check reads the omniflow-release line, so its
      # version and build stay in this form.
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          OmniFlow @V@, build @BUILD@.

          ## Which file do I need?

          | Your device | Download | Install |
          | --- | --- | --- |
          | Android phone or tablet | `omniflow-@V@-android.apk` | Open the APK. OmniFlow updates itself after this. |
          | iPhone or iPad | `omniflow-@V@-ios-unsigned.ipa` | Unsigned, so install it with a sideloading tool. |
          | Mac | `omniflow-@V@-macos.zip` | Unzip it, then right-click OmniFlow and pick Open the first time. |
          | Windows PC | `omniflow-@V@-windows-x64.zip` | Unzip it and run `omniflow_app.exe`. At the SmartScreen prompt pick More info, then Run anyway. |
          | Linux PC | `omniflow-@V@-linux-x64.tar.gz` | Extract it and run `omniflow_app`. |
          | Mac as the hub, or the `omni` CLI | `omniflow-@V@-hub-macos.tar.gz` | Extract it and run `arm64/bin/omni` on Apple silicon or `x64/bin/omni` on Intel. |
          | Older or x86 Android, Google Play, Android TV | `omniflow-@V@-android-extras.zip` | `apk/` has the arm32 and x86_64 apps, `play/` the app bundle and `tv-helper/` the TV pointer helper. |
          | A board to flash by hand | `omniflow-@V@-firmware.zip` | One folder per board. The Android app flashes boards itself. |

          `SHA256SUMS` has the checksum of every file.

          <!-- omniflow-release: version=@V@ build=@BUILD@ -->
          EOF
          sed -i -e "s/@V@/$V/g" -e "s/@BUILD@/$BUILD/g" notes.md
          cat notes.md
      # The generated notes, the changes since the last tag, follow the
      # body.
      - uses: softprops/action-gh-release@v3
        with:
          name: OmniFlow ${{ needs.meta.outputs.version }} (build ${{ needs.meta.outputs.build }})
          body_path: notes.md
          files: dist/*
          generate_release_notes: true
