name: Release

# Push a version tag to publish the Android app:
#   git tag v0.2.0 && git push origin v0.2.0
# Run it by hand (Actions, Release, Run workflow) to build without
# publishing.
#
# The release key comes from three secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS. A tag build fails without
# them: an APK signed with another key cannot update an installed one, so it
# would make people uninstall and lose their home.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "The release key secrets are not set, so this tag is not published."
              exit 1
            fi
            echo "No release key: this build is signed with a debug key."
            exit 0
          fi
          app=packages/omniflow_app/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$app/app/release.jks"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > "$app/key.properties"

      - name: Board firmware
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr esp32:esp32 esp8266:esp8266 rp2040:rp2040
          cd packages/omniflow_app && dart run tool/firmware_assets.dart

      - run: flutter pub get
      - name: Tests
        run: |
          (cd packages/omniflow_engine && dart test)
          (cd packages/omniflow_app && flutter test)

      - name: Build
        working-directory: packages/omniflow_app
        run: flutter build apk --release --split-per-abi

      - name: Collect
        run: |
          v="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = "tag" ] || v="dev"
          mkdir -p dist
          out=packages/omniflow_app/build/app/outputs/flutter-apk
          mv "$out/app-arm64-v8a-release.apk"   "dist/omniflow-$v-android-arm64.apk"
          mv "$out/app-armeabi-v7a-release.apk" "dist/omniflow-$v-android-arm32.apk"
          mv "$out/app-x86_64-release.apk"      "dist/omniflow-$v-android-x86_64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist }

      - name: Publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
