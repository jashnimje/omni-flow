name: omniflow_engine
description: Pure Dart OmniFlow engine (no Flutter dependency) and the omni CLI. Driver manifests, transports, flow validation and execution, presence filtering, storage and MCP tools.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

executables:
  omni: omni

dependencies:
  args: ^2.7.0
  dartssh2: ^4.1.0
  drift: ^2.35.3
  json_path: ^0.9.0
  mcp_dart: ^2.4.3
  pointycastle: ^4.0.0
  sqlite3: ^3.9.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  lints: ^6.0.0
  test: ^1.25.6
