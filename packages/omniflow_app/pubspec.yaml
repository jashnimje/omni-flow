name: omniflow_app
description: "OmniFlow automation studio"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  material_symbols_icons: ^4.2960.0
  nfc_manager: ^4.3.0
  omniflow_engine:
    path: ../omniflow_engine
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/firmware/
